name: Daily Itaú News AI Agent Sync

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Itaú News AI Agent API
        run: |
          curl -s -X GET "https://www.nextuber.com.br/api/cron/fetch-news"
